version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: punchai_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - chroma_data:/app/chroma_db
      - uploads_data:/app/uploads
      - logs_data:/app/logs
    restart: always

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: punchai_ui
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    restart: always
    depends_on:
      - backend

volumes:
  chroma_data:
  uploads_data:
  logs_data:
